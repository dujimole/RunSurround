<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Run Surround</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="intro">
    <img src="assets/intro-bg.png" alt="Intro Background" class="intro-bg"/>
    <div class="intro-text" style="position:absolute; top:25%; left:50%; transform:translate(-50%,-25%); text-align:center; z-index:10;">
      <h1 style="font-size:4rem; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.7); line-height:1.2; margin:0;">
        Run<br>Surround?
      </h1>
      <button id="startBtn" style="margin-top:1rem; font-size:1.75rem; background:rgba(255,255,255,0.2); border:2px solid #fff; color:#fff; padding:0.75rem 2rem; border-radius:0.5rem; cursor:pointer;">YES</button>
    </div>
  </div>

  <!-- Signup form fixed on the right -->
  <div id="signup" class="fixed top-0 right-0 h-full w-72 bg-white shadow-lg p-4 z-50">
    <h2 class="text-xl font-bold mb-4">회원가입</h2>
    <form id="signupForm" class="flex flex-col space-y-3">
      <label class="flex flex-col">
        <span class="text-sm mb-1">이름</span>
        <input id="name" type="text" class="border rounded p-2" required>
      </label>
      <label class="flex flex-col">
        <span class="text-sm mb-1">이메일</span>
        <input id="email" type="email" class="border rounded p-2" required>
      </label>
      <label class="flex flex-col">
        <span class="text-sm mb-1">비밀번호</span>
        <input id="password" type="password" class="border rounded p-2" required>
      </label>
      <button type="submit" class="bg-blue-500 text-white rounded p-2">가입하기</button>
    </form>
  </div>

  <video id="introVideo" src="assets/run_intro.mp4" muted playsinline></video>

  <div id="main">
    <header class="banner">
      <h1>Run Surround and Free</h1>
    </header>

    <!-- Journey Banner -->
    <section class="journey-banner">
      <img src="assets/TheJourney_RunSurround.png" alt="The Journey Run Surround Banner">
      <div class="journey-cta">
        <a href="journey.html">The Journey ‘Run Surround’</a>
      </div>
    </section>

    <section class="lookbook">
      <h2>Lookbook</h2>
      <div class="grid">
        <div>
          <a href="singlet.html">
            <img src="assets/Singlet.png" alt="RUNAR 91 싱글렛"/>
            <p>RUNAR 91 싱글렛</p>
          </a>
        </div>
        <div>
          <a href="shorts.html">
            <img src="assets/Shorts.png" alt="RUNAR 91 쇼츠"/>
            <p>RUNAR 91 쇼츠</p>
          </a>
        </div>
        <div>
          <a href="tshirt.html">
            <img src="assets/Tshirt.png" alt="Run every 티셔츠"/>
            <p>Run every 티셔츠</p>
          </a>
        </div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
